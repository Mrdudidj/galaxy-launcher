name: Deploy website to GitHub Pages

# Publishes website/ as-is (plain HTML/CSS, no build step) to GitHub Pages.
# Triggers on push to master once the branch carrying it merges there;
# workflow_dispatch lets it be triggered manually before that (e.g. right
# after pushing the workflow itself, without waiting on a merge).
on:
  push:
    branches: [master]
    paths: ["website/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website
      - id: deployment
        uses: actions/deploy-pages@v4
