name: Deploy website to GitHub Pages

# Publishes website/ as-is (plain HTML/CSS, no build step) to GitHub Pages.
# Triggers on push to master (the long-term trigger) — cosmetics-mod-and-
# texture-editor is listed too only so this fires once right now, before
# that branch is merged; workflow_dispatch needs the workflow file to
# already be on the default branch to be invocable via API/CLI, which isn't
# true yet, so the push trigger is what's actually doing the work today.
# Safe to drop the feature-branch entry once merged.
on:
  push:
    branches: [master, cosmetics-mod-and-texture-editor]
    paths: ["website/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website
      - id: deployment
        uses: actions/deploy-pages@v4
